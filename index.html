<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="Cache-Control" content="no-cache">

        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="mobile-web-app-capable" content="yes">

        <link rel="icon" type="image/svg+xml" href="favicon.svg">

        <title>Neon Fluid</title>
        <meta name="description" content="A black screen that bleeds neon. Click, drag, and paint with glowing fluid.">

        <meta property="og:type" content="website">
        <meta property="og:title" content="Neon Fluid">
        <meta property="og:description" content="A black screen that bleeds neon. Click, drag, and paint with glowing fluid.">

        <script type="text/javascript" src="dat.gui.min.js"></script>
        <style>
            * {
                user-select: none;
                -webkit-user-select: none;
            }

            html, body {
                overflow: hidden;
                background-color: #000;
            }

            body {
                margin: 0;
                position: fixed;
                width: 100%;
                height: 100%;
            }

            canvas {
                width: 100%;
                height: 100%;
                display: block;
                cursor: crosshair;
            }

            /* dat.GUI — hidden by default (press H to toggle) */
            .dg.main {
                z-index: 10;
            }

            /* Fading center hint */
            #hint {
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                pointer-events: none;
                text-align: center;
                color: rgba(255, 255, 255, 0.55);
                font-family: "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                font-weight: 200;
                letter-spacing: 0.35em;
                text-transform: uppercase;
                z-index: 5;
                transition: opacity 1.2s ease-out;
            }

            #hint .big {
                font-size: 1.6vw;
                text-shadow:
                    0 0 10px rgba(0, 255, 255, 0.8),
                    0 0 30px rgba(255, 0, 255, 0.5);
                animation: pulse 3s ease-in-out infinite;
            }

            #hint .small {
                margin-top: 14px;
                font-size: 0.85vw;
                letter-spacing: 0.5em;
                color: rgba(255, 255, 255, 0.3);
            }

            #hint.hidden {
                opacity: 0;
            }

            /* Microphone overlay — status pill + toggle (bottom-right), and a
               full-viewport spectrum canvas that sits above the fluid. */
            #mic-ui {
                position: fixed;
                right: 16px;
                bottom: 16px;
                display: flex;
                align-items: center;
                gap: 10px;
                z-index: 20;
                pointer-events: none;
                font-family: "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            }

            .mic-indicator {
                pointer-events: none;
                font-size: 12px;
                font-weight: 600;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                padding: 7px 12px;
                border-radius: 999px;
                background: rgba(10, 12, 20, 0.7);
                border: 1px solid rgba(255, 255, 255, 0.12);
                color: rgba(255, 255, 255, 0.45);
                transition: all 0.15s ease;
                backdrop-filter: blur(6px);
            }
            .mic-indicator.live {
                color: #7dffb0;
                border-color: rgba(125, 255, 176, 0.5);
                box-shadow: 0 0 14px rgba(125, 255, 176, 0.35);
            }
            .mic-indicator.beat {
                transform: scale(1.12);
                color: #fff;
                box-shadow: 0 0 22px rgba(255, 120, 255, 0.7);
            }
            .mic-indicator.denied {
                color: #ff8a8a;
                border-color: rgba(255, 120, 120, 0.5);
            }

            .mic-btn {
                pointer-events: auto;
                cursor: pointer;
                font-size: 13px;
                font-weight: 600;
                padding: 7px 14px;
                border-radius: 999px;
                border: 1px solid rgba(0, 255, 255, 0.35);
                background: rgba(0, 20, 25, 0.7);
                color: rgba(0, 255, 255, 0.9);
                transition: all 0.15s ease;
                backdrop-filter: blur(6px);
            }
            .mic-btn:hover {
                background: rgba(0, 40, 45, 0.9);
                box-shadow: 0 0 18px rgba(0, 255, 255, 0.4);
            }

            .mic-viz {
                position: fixed;
                inset: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
                z-index: 6;
            }

            @keyframes pulse {
                0%, 100% { opacity: 0.45; }
                50%      { opacity: 1; }
            }
        </style>
    </head>
    <body>
        <canvas></canvas>

        <div id="hint">
            <div class="big">Drag to Paint</div>
            <div class="small">Neon Fluid &middot; press M for mic</div>
        </div>

        <script src="./script.js"></script>
    </body>
</html>
